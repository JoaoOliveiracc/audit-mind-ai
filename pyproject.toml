[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-ia"
version = "0.1.0"
description = "Agent de auditoria de projetos de desenvolvimento, agnóstico de stack, construído com LangGraph + LangChain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "João Monteiro", email = "joao.monteiro@fabricainfo.com" }]
keywords = ["langchain", "langgraph", "agent", "code-audit", "security", "quality"]

# Mínimos = versões testadas (CI + venv 3.10). `create_agent` + middleware exigem langchain 1.x.
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-core>=1.4",
    "langchain-anthropic>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    # vulnscan (G48): lockfiles YAML/TOML e versões PEP 440
    "pyyaml>=6",
    "packaging>=23",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",          # make coverage / passo "Cobertura" do CI (só reporta)
    "httpx>=0.27",            # FastAPI TestClient (antes só transitivo)
    "types-PyYAML>=6",        # stubs para o mypy (vulnscan usa yaml)
    # Faixas limitadas: versões novas mudam regras/checagens e quebrariam o CI sem aviso.
    "ruff>=0.15,<0.18",
    "mypy>=2.1,<3",
]
# Provedores de LLM adicionais (Anthropic já vem no núcleo). Mínimos = 1ª versão da linha
# compatível com o LangChain 1.x (verificado com `pip --dry-run` contra langchain-core 1.4).
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=3.0"]
groq = ["langchain-groq>=1.0"]
mistral = ["langchain-mistralai>=1.0"]
ollama = ["langchain-ollama>=1.0"]
deepseek = ["langchain-deepseek>=1.0"]
aws = ["langchain-aws>=1.0"]
# G47 — mínimo = 1ª versão que declara langchain-core>=1.0 (metadados do PyPI).
vertexai = ["langchain-google-vertexai>=3.0"]
cohere = ["langchain-cohere>=0.5"]
together = ["langchain-together>=0.4"]
fireworks = ["langchain-fireworks>=1.0"]
# Camada de API/web (FastAPI + SSE + checkpointer persistente).
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "langgraph-checkpoint-sqlite>=2.0",
]
# Instala os provedores mais comuns de uma vez.
all-providers = [
    "langchain-openai>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-groq>=1.0",
    "langchain-mistralai>=1.0",
    "langchain-ollama>=1.0",
    "langchain-deepseek>=1.0",
]

[project.scripts]
auditor = "auditor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Conjunto explícito (o padrão clássico do ruff): o default mudou na 0.17 e passaria
# a exigir dezenas de regras novas. Ampliar aqui é uma decisão consciente.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
